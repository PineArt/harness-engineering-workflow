interface:
  display_name: "Harness Workflow"
  short_description: "Use for repeatable Harness run sheets with explicit owners, repo-backed artifacts, role-scoped context packs, structured risk review, and gate review"
  default_prompt: "Use harness-engineering-workflow when the task fits the Harness-style execution workflow described in SKILL.md, especially when it needs a repeatable run sheet, explicit owners, repo-backed artifacts, role-scoped context packs, or gate review. Start with Fast Tier Check in SKILL.md: choose Ultra Lite when one owner and one validation path are enough, choose Full when two or more Full signals are already true, otherwise choose Lite. For this skill, delegation counts only when execution crosses an independent context boundary. Role labels, tool calls, or spawns that remain within the same context do not satisfy publish separation. If a tier that requires separated owners cannot establish the required independent context boundaries, stop with a fatal Boundary Integrity failure and tell the user final-result quality is uncontrollable. Do not use it for plain one-off coding that does not need workflow artifacts, validation surfaces, or repeatable operating rules."

policy:
  allow_implicit_invocation: true

