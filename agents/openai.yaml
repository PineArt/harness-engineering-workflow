interface:
  display_name: "Harness Workflow"
  short_description: "Use for repeatable Harness run sheets with explicit owners, repo-backed artifacts, role-scoped context packs, structured risk review, and gate review"
  default_prompt: "Use harness-engineering-workflow when the task fits the Harness-style execution workflow described in SKILL.md, especially when it needs a repeatable run sheet, explicit owners, repo-backed artifacts, role-scoped context packs, or gate review. Start with Fast Tier Check in SKILL.md: choose Ultra Lite when one owner and one validation path are enough, choose Full when two or more Full signals are already true, otherwise choose Lite. For this skill, delegation counts only when execution crosses an independent context boundary. Local independent subagents are acceptable owners when they have distinct context boundaries, assigned responsibilities, and artifact outputs; when no external reviewer is required or available, prefer local independent subagents at the highest appropriate reasoning depth for critique, advisory debate, implementation slices, or gate review. Role labels, tool calls, Advisor output, spawns, tool surfaces, protocols, credentials, hosts, paths, sessions, sandboxes, runtimes, or execution environments that remain within the same accountable executor do not satisfy publish separation. Do not reuse the same accountable owner for Advisor and Implementer, Critic, or Quality Gate in the same run. Lite and Full must keep a continuation packet in the run workspace: CURRENT.md points to the latest append-only checkpoints/NNNN-S<step>.md file, and S1/S3/S5/S7 close only after a fresh checkpoint with an incremented Checkpoint Seq. After auto compact, thread copy, or resume, read CURRENT.md, open the latest checkpoint, re-run `python scripts/validate_harness_run.py <run-workspace>`, and continue from the remaining checklist instead of chat summary alone. Before S1 closes and S2 begins, Lite and Full must declare publish intent or record non-publish exploration, must write both Role Owner Table and Run-Specific Responsibility Matrix resolving S6/S7/S8 gate, rework, replay, publish, commit, check-in, and submit ownership, and must pass `python scripts/validate_harness_run.py <run-workspace>`. Orchestrator uses the main thread for high-value architecture, slicing, debate, review synthesis, integration decisions, evidence acceptance, and recovery checkpoints; it does not edit active Implementer writable areas and may only make tiny coordination edits outside owned implementation slices. Orchestrator coordinates, slices, integrates, and records publish evidence, but does not execute phase-critical implementation, runtime verification, publish/commit/submit, or gate verdicts assigned to another owner; assign a Publish Worker when upload, restart, scoped commit, check-in, submit, or publish status confirmation should be separated. Small/fast models are acceptable for bounded mechanical slices, read-only probes, smoke checks, or clear runtime evidence collection, but not final gate decisions, source-fidelity-heavy review, ambiguous architecture decisions, or risky cross-file implementation unless S1/S3 records an explicit exception. If a publishable Lite or Full run imports or continues from non-publish exploration, S0 records that material as evidence or context only, S0-S3 re-close under current Publish intent, and Boundary Status, Gate Decision, publish-readiness claims, Context Pack, Task Graph, or continuation checkpoint closure do not carry forward. For publishable Lite or Full workflows, S1 boundary status cannot be conditional or deferred to final gate; Orchestrator must not own Implementer or Quality Gate, and Quality Gate must be explicit and independent from implementation; if an external context or independent critic subagent covers Critic but not Quality Gate while the main context owns implementation, apply the External-Critic-Only Quality Gate Rule in checklists.md. If a tier that requires separated owners cannot establish the required independent context boundaries, stop with a fatal Boundary Integrity failure and tell the user final-result quality is uncontrollable. Keep mainline context to decisions and artifact pointers. Do not use it for plain one-off coding that does not need workflow artifacts, validation surfaces, or repeatable operating rules."

policy:
  allow_implicit_invocation: true

