interface:
  display_name: "Harness Workflow"
  short_description: "Use for repeatable Harness run sheets with explicit owners, repo-backed artifacts, role-scoped context packs, structured risk review, and gate review"
  default_prompt: "Use harness-engineering-workflow when the task fits the Harness-style execution workflow described in SKILL.md, especially when it needs a repeatable run sheet, explicit owners, repo-backed artifacts, role-scoped context packs, or gate review. Start with Fast Tier Check in SKILL.md: choose Ultra Lite when one owner and one validation path are enough, choose Full when two or more Full signals are already true, otherwise choose Lite. For this skill, delegation counts only when execution crosses an independent context boundary. Role labels, tool calls, Advisor output, or spawns that remain within the same context do not satisfy publish separation. Before S1 closes and S2 begins, Lite and Full must declare publish intent or record the run as non-publish exploration. For publishable Lite or Full workflows, Orchestrator must not own Implementer or Quality Gate, and Quality Gate must be explicit and independent from implementation; if an external context covers Critic but not Quality Gate while the main context owns implementation, apply the External-Critic-Only Quality Gate Rule in checklists.md. If a tier that requires separated owners cannot establish the required independent context boundaries, stop with a fatal Boundary Integrity failure and tell the user final-result quality is uncontrollable. Do not use it for plain one-off coding that does not need workflow artifacts, validation surfaces, or repeatable operating rules."

policy:
  allow_implicit_invocation: true

